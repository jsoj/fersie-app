<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Fersie — Gestão Web{% endblock %}</title>
  <!-- Design System CSS -->
  <link rel="stylesheet" href="/static/css/fersie-design-system.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <!-- HTMX library -->
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="fersie-text-body">
  <nav class="fersie-app-nav">
    <div class="fersie-nav-brand">
      <a href="{% url 'core:dashboard' %}" class="fersie-heading-md">FERSIE APP</a>
    </div>
    <ul class="fersie-app-links">
      <li><a href="{% url 'core:dashboard' %}">Dashboard</a></li>
      <li><a href="{% url 'inventory:product_list' %}">Estoque</a></li>
      <li><a href="{% url 'financial:overview' %}">Financeiro</a></li>
      <li><a href="{% url 'catalog:visual_catalog' %}">Catálogo</a></li>
      <li><a href="{% url 'ai_assistant:chat' %}">Assistente IA</a></li>
    </ul>
  </nav>

  <main class="fersie-app-container">
    {% block content %}
    {% endblock %}
  </main>

  <script src="/static/js/app.js"></script>
</body>
</html>
