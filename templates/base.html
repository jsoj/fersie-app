<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Fersie — Gestão Web{% endblock %}</title>
  <!-- Design System CSS -->
  <link rel="stylesheet" href="/static/css/fersie-design-system.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <!-- HTMX library -->
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="fersie-text-body">
  <nav class="fersie-app-nav">
    <div class="fersie-nav-brand">
      <a href="{% url 'core:dashboard' %}" class="fersie-heading-md">FERSIE APP</a>
    </div>
    <ul class="fersie-app-links">
      <li><a href="{% url 'core:dashboard' %}">Dashboard</a></li>
      <li><a href="{% url 'inventory:product_list' %}">Estoque</a></li>
      <li><a href="{% url 'financial:overview' %}">Financeiro</a></li>
      <li><a href="{% url 'catalog:visual_catalog' %}">Catálogo</a></li>
      <li><a href="{% url 'ai_assistant:chat' %}">Assistente IA</a></li>
    </ul>
    <div class="fersie-nav-user" style="display: flex; align-items: center; gap: 1rem; margin-left: auto;">
      {% if user.is_authenticated %}
        <span style="font-size: 0.85rem; color: #d1d5db;">Olá, <strong>{{ user.first_name|default:user.username }}</strong></span>
        {% if user.is_staff %}
          <a href="/admin/" style="font-size: 0.85rem; color: var(--fersie-gold); text-decoration: none; border-bottom: 1px dotted var(--fersie-gold);" title="Painel Técnico Django">Admin</a>
        {% endif %}
        <form method="post" action="{% url 'logout' %}" style="display: inline; margin: 0;">
          {% csrf_token %}
          <button type="submit" style="background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 0.3rem 0.75rem; border-radius: 4px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s;">Sair</button>
        </form>
      {% endif %}
    </div>
  </nav>

  <main class="fersie-app-container">
    {% block content %}
    {% endblock %}
  </main>

  <script src="/static/js/app.js"></script>
</body>
</html>
