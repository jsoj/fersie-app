<!-- User Message Bubble -->
<div class="chat-bubble user-bubble">
  <div class="bubble-meta">
    {% if user_msg.user %}{{ user_msg.user.username }}{% else %}Você{% endif %} &bull; {{ user_msg.timestamp|date:"H:i" }}
  </div>
  <div class="bubble-text">{{ user_msg.content }}</div>
</div>

<!-- Assistant Message Bubble -->
<div class="chat-bubble assistant-bubble">
  <div class="bubble-meta assistant-meta">
    <span class="fersie-ai-tag">FERSIE AI</span>
    <span>&bull; {{ assistant_msg.timestamp|date:"H:i" }}</span>
  </div>
  <div class="markdown-raw" style="display: none;">{{ assistant_msg.content }}</div>
  <div class="markdown-body"></div>
</div>

<script>
  if (typeof renderAllStoredMarkdown === 'function') {
    renderAllStoredMarkdown();
  }
  if (typeof scrollChatToBottom === 'function') {
    scrollChatToBottom();
  }
</script>
